name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Check formatting
        run: ruff format ETL/ models/ --check

  validate-compose:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  shellcheck:
    name: Shellcheck entrypoint.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck
        run: shellcheck monitoring/prometheus/entrypoint.sh

  validate-nginx:
    name: Validate nginx.conf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Substitute env placeholders and validate
        run: |
          # Use the .env file but override hostnames to localhost for syntax validation,
          # since nginx -t tries to resolve upstream hosts even for config testing.
          docker run --rm \
            -v ${{ github.workspace }}/nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro \
            --env-file .env \
            -e ETL_API_HOST=localhost \
            -e SPARK_MASTER_HOST=localhost \
            -e GRAFANA_HOST=localhost \
            -e PROMETHEUS_HOST=localhost \
            -e PUSHGATEWAY_HOST=localhost \
            -e RABBITMQ_MGMT_HOST=localhost \
            nginx:1.27-alpine nginx -t

  test:
    name: Test ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: api
            context: ETL/api
          - module: extract
            context: ETL/extract
          - module: transform
            context: ETL/transform
            java: true
          - module: load
            context: ETL/load

    steps:
      - uses: actions/checkout@v4

      - name: Load environment variables
        run: |
          if [ -f .env ]; then
            # Read .env file and set environment variables for subsequent steps
            while IFS= read -r line; do
              # Skip comments and empty lines
              [[ $line =~ ^[[:space:]]*# ]] && continue
              [[ -z "$line" ]] && continue
              
              # Remove inline comments
              line=$(echo "$line" | sed 's/[[:space:]]*#.*$//')
              
              # Split on first = only
              key=$(echo "$line" | cut -d'=' -f1)
              value=$(echo "$line" | cut -d'=' -f2-)
              
              # Remove quotes from value if present
              value=$(echo "$value" | sed 's/^"\(.*\)"$/\1/' | sed "s/^'\(.*\)'$/\1/")
              
              # Skip if key or value is empty
              [[ -z "$key" ]] && continue
              
              echo "$key=$value" >> $GITHUB_ENV
            done < .env
            echo "Environment variables loaded from .env file"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java (for transform tests)
        if: matrix.java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        working-directory: ${{ matrix.context }}
        run: |
          pip install -r requirements.txt

      - name: Run tests
        working-directory: ${{ matrix.context }}
        run: |
          python -m pytest test/ -v --tb=short --asyncio-mode=auto -o asyncio_default_fixture_loop_scope=function

  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: extract
            context: ETL/extract
          - service: transform
            context: ETL/transform
          - service: load
            context: ETL/load
          - service: api
            context: ETL/api
          - service: fare
            context: models/fare

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
